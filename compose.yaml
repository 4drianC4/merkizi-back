name: merkizi

x-php: &php
  build:
    context: .
    dockerfile: docker/php/Dockerfile
  working_dir: /var/www/html
  user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
  volumes:
    - .:/var/www/html
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  app:
    <<: *php

  web:
    image: nginx:stable-alpine
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./public:/var/www/html/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  worker:
    <<: *php
    command: ["php", "artisan", "queue:work", "redis", "--queue=banking,default,exports", "--sleep=1", "--tries=3", "--timeout=60"]
    stop_grace_period: 90s

  scheduler:
    <<: *php
    command: ["php", "artisan", "schedule:work"]

  db:
    image: postgres:18-bookworm
    environment:
      POSTGRES_DB: merkizi
      POSTGRES_USER: merkizi
      POSTGRES_PASSWORD: local_dev_only
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U merkizi -d merkizi"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  redis_data:
