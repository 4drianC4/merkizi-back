[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/tmp/supervisord.pid
childlogdir=/tmp

[program:php-fpm]
command=php-fpm -F
autostart=true
autorestart=true
stopsignal=QUIT
stopwaitsecs=90
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -c /tmp/nginx.conf -g "daemon off;"
autostart=true
autorestart=true
stopsignal=QUIT
stopwaitsecs=90
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
