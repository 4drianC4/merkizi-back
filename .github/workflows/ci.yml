name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Pint / Larastan / Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-bookworm
        env:
          POSTGRES_USER: merkizi
          POSTGRES_PASSWORD: local_dev_only
          POSTGRES_DB: merkizi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U merkizi -d merkizi_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_HOST: 127.0.0.1
      REDIS_HOST: 127.0.0.1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, intl, zip, bcmath, pcntl, mbstring, redis
          coverage: none

      - name: Validate composer
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Pint
        run: composer pint:test

      - name: Larastan
        run: composer phpstan

      - name: Prepare environment
        run: cp .env.testing .env

      - name: Migrate
        run: php artisan migrate --force --no-interaction

      - name: Tests
        run: php artisan test

  openapi:
    name: OpenAPI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate OpenAPI
        run: npx --yes @redocly/cli lint docs/api/openapi.yaml

  build:
    name: Build image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -f docker/php/Dockerfile -t merkizi/app .
